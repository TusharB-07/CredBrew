[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/api",
    "crates/worker",
]
exclude = ["frontend"]

[workspace.dependencies]
axum = { version = "0.8", features = ["json", "multipart", "query", "tracing", "macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
qrcode = "0.14"
resvg = "=0.32.0"
usvg = "=0.32.0"
tiny-skia = "=0.6.0"
fontdb = "=0.11.0"
roxmltree = "0.20"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls", "smtp-transport", "builder", "ring", "webpki-roots"] }
object_store = { version = "0.10", features = ["aws"] }
askama = "0.12"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = { version = "0.8", features = ["small_rng"] }
tower_governor = { version = "0.7", features = ["axum"] }
tower = "0.4"
ttf-parser = "0.16"
config = { version = "0.14", features = ["toml"] }
once_cell = "1.19"
percent-encoding = "2.3"
rustls = "0.23"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
regex = "1.10"
tokio-stream = "0.1"
dotenv = "0.15"
tokio-test = "0.4"
lazy_static = "1.4"
bytes = "1"
quick-xml = "0.31"

# v1.0 — DID + Verifiable Credentials (Phase 2)
ed25519-dalek = { version = "2", features = ["rand_core"] }
multibase = "0.9"
bs58 = "0.5"
sha2 = "0.10"
hex = "0.4"
serde_json_with_preserve_order = { package = "serde_json", version = "1.0", features = ["preserve_order"] }

# v1.0 Phases 4/5/6 — magic-link auth, anchoring
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"

[profile.release]
lto = true
codegen-units = 1